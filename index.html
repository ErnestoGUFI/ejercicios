<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Catálogo tecnológico con noticias obtenidas desde una API pública.">
    <meta name="theme-color" content="#1e3a5f">
    <title>Tech catálogo - Datos de una API</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="TechCatálogo">
    <link rel="apple-touch-startup-image" href="icons/splash-1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
    <link rel="stylesheet" href="styles/tokens.css">
    <link rel="stylesheet" href="styles/shell.css">
    <link rel="stylesheet" href="styles/components.css">
    <link rel="stylesheet" href="styles/views.css">
  </head>
  <body>
    <button class="skip-link" type="button">Saltar al contenido</button>
    <header class="site-header">
      <div class="shell-row">
        <a class="brand" href="#/" data-link>Tech catálogo</a>
        <nav aria-label="Navegación principal">
          <a href="#/" data-link>Inicio</a>
          <a href="#/noticias" data-link>Noticias</a>
          <a href="#/guardados" data-link>Guardados</a>
          <a href="#/persistencia" data-link>Persistencia</a>
          <a href="#/service-worker" data-link>Service Worker</a>
          <a href="#/acerca" data-link>Acerca</a>
        </nav>
        <div class="shell-actions">
          <button id="install-button" class="install-button" type="button" hidden>Instalar app</button>
          <div class="theme-control">
            <label for="theme-select">Tema</label>
            <select id="theme-select" aria-label="Tema de color">
              <option value="light">Claro</option>
              <option value="dark">Oscuro</option>
            </select>
          </div>
        </div>
      </div>
    </header>
    <p id="persistence-warning" class="persistence-warning" aria-live="polite" hidden></p>
    <p id="network-status" class="network-status" role="status" aria-live="polite" hidden></p>
    <div id="install-hint" class="install-hint" role="status" aria-live="polite" hidden>
      <p data-install-message></p>
      <button class="install-hint-dismiss" type="button" data-install-dismiss>Entendido</button>
    </div>
    <main id="app" class="app-content" aria-live="polite" tabindex="-1"></main>
    <footer class="site-footer">
      <p>Tech catálogo</p>
    </footer>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
