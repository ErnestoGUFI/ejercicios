<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Comprobación del Service Worker con scope estrecho.">
    <meta name="theme-color" content="#1e3a5f">
    <title>Prueba de scope estrecho</title>
    <link rel="manifest" href="../manifest.json">
    <link rel="icon" href="../icons/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="TechCatálogo">
    <link rel="apple-touch-startup-image" href="../icons/splash-1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
    <link rel="stylesheet" href="../styles/tokens.css">
    <link rel="stylesheet" href="../styles/shell.css">
    <link rel="stylesheet" href="../styles/components.css">
    <link rel="stylesheet" href="../styles/views.css">
  </head>
  <body class="scope-demo-page">
    <main class="app-content" aria-labelledby="scope-demo-title">
      <section class="service-worker-view">
        <h1 id="scope-demo-title">Página dentro del scope estrecho</h1>
        <p class="page-summary">Cuando existen dos registros aplicables, el navegador elige el que tiene el scope más específico.</p>
        <dl class="sw-status-list">
          <div><dt>Controller actual</dt><dd><code data-scope-demo-controller>Consultando…</code></dd></div>
          <div><dt>Scope seleccionado</dt><dd><code data-scope-demo-scope>Consultando…</code></dd></div>
        </dl>
        <div class="sw-actions">
          <button class="sw-button" type="button" data-reload-scope-demo>Recargar página</button>
          <a class="text-link" href="../#/service-worker">Volver al diagnóstico</a>
        </div>
        <p class="sw-feedback" data-scope-demo-feedback aria-live="polite"></p>
      </section>
    </main>
    <script type="module" src="../src/pwa/scopeDemo.js"></script>
  </body>
</html>
